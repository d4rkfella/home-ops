---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apk-registry
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: apk-registry
  values:
    controllers:
      apk-registry:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/d4rkfella/apk-registry
              tag: latest
              pullPolicy: IfNotPresent
            command:
              - /usr/local/bin/apk-registry
            env:
              LISTEN_ADDR: ":8080"
              STORAGE_ROOT: /var/lib/apk-registry
              REGISTRY_REPOSITORY: wolfi-os
              REGISTRY_PUBLIC_READ: "true"
              APK_INDEX_FORMAT: v2
              REGISTRY_ADMIN_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: REGISTRY_ADMIN_USERNAME
              REGISTRY_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: REGISTRY_ADMIN_PASSWORD
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: apk-registry
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - apk-registry.darkfella.space
        parentRefs:
          - name: apk-registry
            namespace: envoy-gateway-system
            sectionName: https
        rules:
          - backendRefs:
              - name: apk-registry
                port: 8080
    persistence:
      packages:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 100Gi
        globalMounts:
          - path: /var/lib/apk-registry
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
