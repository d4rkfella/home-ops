---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-secret
    template:
      data:
        KEYCLOAK__POSTGRES__USER: "{{ .KEYCLOAK_POSTGRES_USER }}"
        KEYCLOAK__POSTGRES__PASSWORD: "{{ .KEYCLOAK_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: kv/keycloak
