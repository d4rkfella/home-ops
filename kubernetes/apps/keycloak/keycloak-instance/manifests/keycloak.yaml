---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/k8s.keycloak.org/keycloak_v2beta1.json
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  unsupported:
    podTemplate:
      metadata:
        annotations:
          security.darkfellanetwork.com/mount-postgres-ca: "true"
      spec:
        volumes:
          - name: tmpfs
            emptyDir: {}
          - name: data
            emptyDir: {}
        containers:
          - name: keycloak
            env:
              - name: KC_DB_URL_PROPERTIES
                value: ?sslmode=verify-full&sslrootcert=/etc/ssl/certs/postgres-ca.crt
            volumeMounts:
              - name: data
                mountPath: /usr/share/java/keycloak/data
              - name: tmpfs
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        hostUsers: false
  db:
    vendor: postgres
    usernameSecret:
      name: keycloak-secret
      key: POSTGRES_USERNAME
    passwordSecret:
      name: keycloak-secret
      key: POSTGRES_PASSWORD
    host: postgres-db-rw.database.svc.cluster.local
    database: keycloak
    port: 5432
    schema: public
  instances: 1
  image: ghcr.io/d4rkfella/keycloak:26.7.3@sha256:9a802c93ed85b229c74c6af093215be064af09a3c8e662400b16c0fc3454248e
  startOptimized: true
  proxy:
    headers: xforwarded
  hostname:
    hostname: https://accounts.darkfellanetwork.com
  http:
    httpEnabled: true
    httpPort: 8080
  ingress:
    enabled: false
