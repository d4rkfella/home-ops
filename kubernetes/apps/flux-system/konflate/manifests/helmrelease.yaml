---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://d4rkfella/home-ops
      statusChecks: true
      prComments: true
      publicUrl: https://{{ .Release.Name }}.darkfellanetwork.com
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: "conditions: [\"[STATUS] == 200\"]"
      parentRefs:
        - name: external
          namespace: envoy-gateway-system
      hostnames:
        - "{{ .Release.Name }}.darkfellanetwork.com"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 2Gi
