---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.2
  policy:
    rebootMode: default
  healthChecks:
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
  hooks:
    pre:
      - name: nas-nfs-quiesce
        image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
        backoffLimit: 5
        activeDeadlineSeconds: 3600
        serviceAccountName: tuppr-nfs-hook
        command:
          - /bin/bash
          - /scripts/pre.sh
        volumeMounts:
          - name: hook-scripts
            mountPath: /scripts
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: hook-scripts
            configMap:
              name: nfs-quiesce-scripts
              defaultMode: 493
          - name: tmp
            emptyDir: {}
    post:
      - name: restore-nfs-consumers
        image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
        backoffLimit: 5
        activeDeadlineSeconds: 3600
        serviceAccountName: tuppr-nfs-hook
        command:
          - /bin/bash
          - /scripts/post.sh
        volumeMounts:
          - name: hook-scripts
            mountPath: /scripts
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: hook-scripts
            configMap:
              name: nfs-quiesce-scripts
              defaultMode: 493
          - name: tmp
            emptyDir: {}
