---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
{
  apiVersion: "grafana.integreatly.org/v1beta1",
  kind: "GrafanaDashboard",
  metadata: {
    name: "artifactory-log-analytics-and-system-metrics",
  },
  spec: {
    allowCrossNamespaceImport: true,
    instanceSelector: {
      matchLabels: {
        grafana.internal/instance: "grafana",
      },
    },
    url: "https://raw.githubusercontent.com/jfrog/log-analytics-prometheus/refs/heads/master/grafana/ArtifactoryMetrics.json",
  },
}
---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
