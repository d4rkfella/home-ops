---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: keycloak
  namespace: database
spec:
  cluster:
    name: postgres-db
  name: keycloak
  login: true
  superuser: false
  passwordSecret:
    name: keycloak-db-password
  databaseRoleReclaimPolicy: retain
