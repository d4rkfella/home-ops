---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cleanrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cleanrr-secret
    template:
      data:
        CLEANRR_SERVERS__RADARR__API_KEY: "{{ .RADARR_API_KEY }}"
        CLEANRR_SERVERS__SONARR__API_KEY: "{{ .SONARR_API_KEY }}"
  dataFrom:
    - extract:
        key: kv/radarr
    - extract:
        key: kv/sonarr
