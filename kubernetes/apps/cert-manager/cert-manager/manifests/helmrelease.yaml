---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    global:
      hostUsers: false
    crds:
      enabled: true
      keep: true
    enableCertificateOwnerRef: true
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        endpointAdditionalProperties:
          scheme: https
          tlsConfig:
            serverName: cert-manager-metrics
            ca:
              secret:
                name: cert-manager-metrics-ca
                key: tls.crt
    config:
      metricsTLSConfig:
        dynamic:
          secretNamespace: cert-manager
          secretName: cert-manager-metrics-ca
          dnsNames:
            - cert-manager-metrics
    webhook:
      config:
        metricsTLSConfig:
          dynamic:
            secretNamespace: cert-manager
            secretName: cert-manager-metrics-ca
            dnsNames:
              - cert-manager-metrics
    cainjector:
      config:
        metricsTLSConfig:
          dynamic:
            secretNamespace: cert-manager
            secretName: cert-manager-metrics-ca
            dnsNames:
              - cert-manager-metrics
