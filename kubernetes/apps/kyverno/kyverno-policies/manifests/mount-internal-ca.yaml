---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mount-internal-ca
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  matchConditions:
    - name: mount-internal-ca-enabled
      expression: >-
        object.metadata.?annotations[
          'security.darkfellanetwork.com/mount-internal-ca'
        ].orValue('') == 'true'

  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              volumes:
                (
                  has(object.spec.volumes)
                  ? object.spec.volumes
                  : []
                )
                +
                (
                  (
                    has(object.spec.volumes) &&
                    object.spec.volumes.exists(v, v.name == "internal-ca")
                  )
                  ? []
                  : [
                      Object.spec.volumes{
                        name: "internal-ca",
                        secret: Object.spec.volumes.secret{
                          secretName: "internal-ca-secret"
                        }
                      }
                    ]
                ),

              containers: object.spec.containers.map(c,
                Object.spec.containers{
                  name: c.name,
                  volumeMounts:
                    (
                      has(c.volumeMounts)
                      ? c.volumeMounts
                      : []
                    )
                    +
                    (
                      (
                        has(c.volumeMounts) &&
                        c.volumeMounts.exists(m, m.name == "internal-ca")
                      )
                      ? []
                      : [
                          Object.spec.containers.volumeMounts{
                            name: "internal-ca",
                            mountPath: "/etc/ssl/certs/internal-ca.crt",
                            subPath: "ca.crt",
                            readOnly: true
                          }
                        ]
                    )
                }
              ),

              initContainers:
                has(object.spec.initContainers)
                ?
                object.spec.initContainers.map(c,
                  Object.spec.initContainers{
                    name: c.name,
                    volumeMounts:
                      (
                        has(c.volumeMounts)
                        ? c.volumeMounts
                        : []
                      )
                      +
                      (
                        (
                          has(c.volumeMounts) &&
                          c.volumeMounts.exists(m, m.name == "internal-ca")
                        )
                        ? []
                        : [
                            Object.spec.initContainers.volumeMounts{
                              name: "internal-ca",
                              mountPath: "/etc/ssl/certs/internal-ca.crt",
                              subPath: "ca.crt",
                              readOnly: true
                            }
                          ]
                      )
                  }
                )
                : []
            }
          }
