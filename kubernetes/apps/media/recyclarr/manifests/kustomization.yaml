---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./podmonitor.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: recyclarr-configmap
    files:
      - resources/recyclarr.yml
      - resources/settings.yml
generatorOptions:
  disableNameSuffixHash: true
