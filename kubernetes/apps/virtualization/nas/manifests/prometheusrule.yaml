---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
{
  apiVersion: "monitoring.coreos.com/v1",
  kind: "PrometheusRule",
  metadata: {
    name: "zfs-pool-rules",
  },
  spec: {
    groups: [{
      name: "zfs-pool-health",
      rules: [{
        alert: "ZfsPoolUnhealthy",
        expr: "last_over_time(zfs_pool_health[1h]) > 0",
        for: "5m",
        labels: {
          severity: "critical",
        },
        annotations: {
          summary: "ZFS pool {{ $labels.pool }} on instance {{ $labels.instance }} is unhealthy",
          description: "\
             ZFS pool state is {{ $value }}. Where:\n\
            \  - 0: ONLINE\n\
            \  - 1: DEGRADED\n\
            \  - 2: FAULTED\n\
            \  - 3: OFFLINE\n\
            \  - 4: UNAVAIL\n\
            \  - 5: REMOVED\n\
            \  - 6: SUSPENDED\n\
            \  VALUE = {{ $value }}\n\
            \  LABELS = {{ $labels }}\
            ",
        },
      }],
    }, {
      name: "zfs-pool-usage",
      rules: [{
        alert: "ZfsPoolOutOfSpace",
        expr: "zfs_pool_free_bytes * 100 / zfs_pool_size_bytes < 10 and ON (instance, device, mountpoint) zfs_pool_readonly == 0",
        for: "5m",
        labels: {
          severity: "warning",
        },
        annotations: {
          summary: "ZFS pool is running out of space (instance {{ $labels.instance }})",
          description: "\
             ZFS pool is almost full (< 10% left)\n\
            \  VALUE = {{ $value }}\n\
            \  LABELS = {{ $labels }}\
            ",
        },
      }],
    }],
  },
}
