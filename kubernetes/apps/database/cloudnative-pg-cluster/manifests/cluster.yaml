---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-db
  labels:
    cnpg.io/reload: ""
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  monitoring:
    tls:
      enabled: true
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:452a15584e2aa1ce658c4ae8538b5dc157eb031d41b82fd19882e0c03bcec01d
  primaryUpdateStrategy: unsupervised
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: openebs-zfs-32k
      volumeMode: Filesystem
    resizeInUseVolumes: true
  walStorage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: openebs-zfs-32k
      volumeMode: Filesystem
  superuserSecret:
    name: postgres-admin-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 1843MB
      wal_init_zero: "off"
      wal_recycle: "off"
      huge_pages: "on"
      work_mem: 10MB
    pg_hba:
      - host all all 172.16.0.0/16 scram-sha-256
      - host all all 127.0.0.1/32 scram-sha-256
      - hostssl all all all scram-sha-256
      - host all all all reject
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 512Mi
      hugepages-2Mi: 2Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cloudflare
        serverName: postgres-db-3
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cloudflare
          serverName: postgres-db-2
  managed:
    roles:
      - name: keycloak
        login: true
        superuser: false
        passwordSecret:
          name: keycloak-db-password
      - name: radarr
        login: true
        superuser: false
        passwordSecret:
          name: radarr-db-password
      - name: sonarr
        login: true
        superuser: false
        passwordSecret:
          name: sonarr-db-password
      - name: prowlarr
        login: true
        superuser: false
        passwordSecret:
          name: prowlarr-db-password
      - name: bazarr
        login: true
        superuser: false
        passwordSecret:
          name: bazarr-db-password
      - name: autobrr
        login: true
        superuser: false
        passwordSecret:
          name: autobrr-db-password
      - name: seerr
        login: true
        superuser: false
        passwordSecret:
          name: seerr-db-password
      - name: vaultwarden
        login: true
        superuser: false
        passwordSecret:
          name: vaultwarden-db-password
      - name: gatus
        login: true
        superuser: false
        passwordSecret:
          name: gatus-db-password
      - name: qui
        login: true
        superuser: false
        passwordSecret:
          name: qui-db-password
