---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
{
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "multus",
  },
  spec: {
    interval: "1h",
    chartRef: {
      kind: "OCIRepository",
      name: "multus",
    },
    postRenderers: [{
      kustomize: {
        patches: [{
          target: {
            kind: "DaemonSet",
            name: "multus",
          },
          patch: "\
             - op: add\n\
            \  path: /spec/template/spec/containers/0/args\n\
            \  value:\n\
            \    - \"--cleanup-config-on-exit\"\n\
            \    - \"--multus-bin-file=/usr/bin/multus\"\n\
            \    - \"--multus-cni-conf-dir=/tmp\"\n\
            ",
        }],
      },
    }],
    values: {
      cni-plugins: {
        image: {
          repository: "ghcr.io/d4rkfella/cni-plugins",
          tag: "1.9.1@sha256:f8b2bd1fd7261f64cf15070563ae1f86a5b2a5484616d82d460046b73b00b42b",
        },
        resources: {},
      },
      multus: {
        image: {
          repository: "ghcr.io/d4rkfella/multus-cni",
          tag: "4.2.4@sha256:7ee6f3212ca771e115e8c004a1c26c31dcc3f0bd1237ab0ed2208854dc4d67f6",
        },
        resources: {
          requests: {
            cpu: "10m",
          },
          limits: {
            memory: "512Mi",
          },
        },
      },
      cni: {
        netPath: "/etc/cni/net.d",
        binPath: "/opt/cni/bin",
      },
    },
  },
}
