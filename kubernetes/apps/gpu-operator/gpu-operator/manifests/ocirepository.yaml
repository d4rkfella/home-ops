---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gpu-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v26.7.1
  url: oci://nvcr.io/nvidia/cloud-native-charts/gpu-operator
  verify:
    provider: cosign
    secretRef:
      name: nvidia-ngc-cosign-public-key
