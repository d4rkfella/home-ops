---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sonarr-secret
    template:
      data:
        SONARR__AUTH__APIKEY: "{{ .SONARR_API_KEY }}"
        SONARR__POSTGRES__PASSWORD: "{{ .SONARR_POSTGRES_PASSWORD }}"
        SONARR__AUTH__OIDCCLIENTSECRET: "{{ .SONARR_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: kv/sonarr
