---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-cloudinit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: nas-cloudinit
    template:
      data:
        userdata: |
          #cloud-config
          hostname: nas
          fqdn: nas.darkfellanetwork.com
          timezone: Europe/Sofia

          users:
            - name: nas_admin
              groups: [sudo, users, systemd-journal, adm]
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              lock_passwd: false
              no_user_group: true
              passwd: {{ .NAS_ADMIN_PASSWORD }}
              ssh_authorized_keys:
                - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIx83FBOhdNFJdkycrja/72bDI5lQlATVQm8vgZtTy4L d4rkfella@TheBeast

            - name: darkfella
              shell: /usr/sbin/nologin
              lock_passwd: true
              no_create_home: true
              no_user_group: true
              sudo: null

            - name: kubernetes_workloads
              uid: 65532
              shell: /usr/sbin/nologin
              lock_passwd: true
              no_create_home: true
              no_user_group: true
              sudo: null

            - name: artifactory-system
              uid: 1030
              shell: /usr/sbin/nologin
              lock_passwd: true
              no_create_home: true
              no_user_group: true
              sudo: null

          package_update: true
          package_upgrade: true

          packages:
            - qemu-guest-agent
            - zfsutils-linux
            - nfs-kernel-server
            - nfs-common
            - acl
            - attr
            - samba
            - wsdd-server
            - smartmontools
            - msmtp
            - msmtp-mta
            - mailutils

          write_files:
            - path: /etc/nfs.conf.d/local.conf
              content: |
                [nfsd]
                vers3=n
                vers4=y
                vers4.1=y
                vers4.2=y

            - path: /etc/exports
              content: |
                /mnt/exos20/data *(sec=sys,rw,insecure,no_subtree_check)
                /mnt/exos20/data/media *(sec=sys,rw,insecure,subtree_check)
                /mnt/exos20/data/downloads/torrents *(sec=sys,rw,insecure,subtree_check)
                /mnt/exos20/artifactory-backup *(sec=sys,rw,insecure,no_subtree_check)

            - path: /etc/samba/smb.conf
              content: |
                [global]
                  disable netbios = yes
                  workgroup = WORKGROUP
                  server string = NAS
                  server role = standalone server
                  ntlm auth = ntlmv2-only
                  server min protocol = SMB3
                  server max protocol = SMB3
                  security = user
                  passdb backend = tdbsam
                  map to guest = never
                  guest ok = no
                  logging = systemd
                  log level = 1
                  min receivefile size = 16384
                  aio read size = 16384
                  aio write size = 16384
                  socket options = TCP_NODELAY IPTOS_LOWDELAY
                  inherit acls = yes
                  map acl inherit = yes
                  inherit permissions = no
                  create mask = 0660
                  directory mask = 0770
                  force create mode = 0000
                  force directory mode = 0000
                  nt acl support = yes

                [data]
                  path = /mnt/exos20/data
                  browseable = yes
                  read only = no
                  valid users = darkfella

                [shared]
                  path = /mnt/exos20/shared
                  browseable = yes
                  read only = no
                  valid users = darkfella

            - path: /etc/msmtprc
              owner: root:root
              permissions: '0600'
              content: |
                defaults
                auth            on
                tls             on
                tls_trust_file  /etc/ssl/certs/ca-certificates.crt
                logfile         -

                account         brevo
                host            smtp-relay.brevo.com
                port            587
                from            nas@darkfellanetwork.com
                user            {{ .SMTP_EMAIL }}
                password        {{ .SMTP_API_TOKEN }}

                account default : brevo

            - path: /etc/smartd.conf
              content: |
                # S/../../(1|4)/02 = Short Mon/Thu at 2am
                # L/(02|04|06|08|10|12)/15/./04 = Long 15th of Even Months at 4am
                DEFAULT -a -m {{ .SMTP_EMAIL }} -s (S/../../(1|4)/02|O/../../6/03|L/(02|04|06|08|10|12)/15/./04)
                DEVICESCAN -d auto

            - path: /etc/systemd/system/zfs-scrub.service
              content: |
                [Unit]
                Description=ZFS scrub on media pool
                After=zfs.target

                [Service]
                Type=oneshot
                ExecStart=/sbin/zpool scrub exos20

            - path: /etc/systemd/system/zfs-scrub.timer
              content: |
                [Unit]
                Description=Monthly ZFS scrub on media pool

                [Timer]
                OnCalendar=*-*-01 03:00:00
                RandomizedDelaySec=1h
                Persistent=true

                [Install]
                WantedBy=timers.target

            - path: /etc/systemd/system/zfs_exporter.service
              content: |
                [Unit]
                Description=ZFS Prometheus Exporter
                After=network-online.target

                [Service]
                User=root
                Group=root
                Type=simple
                ExecStart=/usr/local/bin/zfs_exporter --pool=exos20 --collector.dataset-snapshot
                Restart=on-failure

                [Install]
                WantedBy=multi-user.target

          runcmd:
            - systemctl enable zfs-import-cache.service
            - systemctl enable zfs-import.target
            - systemctl enable zfs-mount.service
            - systemctl enable zfs.target
            - zpool import -f exos20

            - ufw enable
            - ufw allow 2049/tcp
            - ufw allow 445/tcp
            - ufw allow 3702/udp
            - ufw allow 5357/tcp
            - ufw allow 111/udp
            - ufw allow 22/tcp
            - ufw allow 9134/tcp
            - ufw allow in on enp2s0 proto igmp

            - groupadd -g 1400 media_users
            - usermod -aG media_users darkfella
            - usermod -aG media_users kubernetes_workloads

            - zfs set acltype=posixacl exos20/data
            - zfs set xattr=sa exos20/data
            - setfacl -bR /mnt/exos20/data
            - setfacl -R -m user:nas_admin:rwx /mnt/exos20/data
            - setfacl -R -m default:user:nas_admin:rwx /mnt/exos20/data
            - setfacl -R -m group:media_users:rwX /mnt/exos20/data
            - setfacl -R -m default:group:media_users:rwX /mnt/exos20/data
            - setfacl -R -m other::--- /mnt/exos20/data
            - setfacl -R -m default:other::--- /mnt/exos20/data
            - setfacl -m user:nobody:--x /mnt/exos20/data
            - setfacl -m user:nobody:--x /mnt/exos20/data/downloads
            - setfacl -m user:nobody:--x /mnt/exos20/data/downloads/torrents
            - setfacl -m user:nobody:--x /mnt/exos20/data/media
            - setfacl -R -m group::--- /mnt/exos20/data
            - setfacl -R -m default:group::--- /mnt/exos20/data

            - zfs set acltype=posixacl exos20/shared
            - zfs set xattr=sa exos20/shared
            - setfacl -bR /mnt/exos20/shared
            - setfacl -R -m user:nas_admin:rwx /mnt/exos20/shared
            - setfacl -R -m default:user:nas_admin:rwx /mnt/exos20/shared
            - setfacl -R -m group:media_users:rwX /mnt/exos20/shared
            - setfacl -R -m default:group:media_users:rwX /mnt/exos20/shared
            - setfacl -R -m other::--- /mnt/exos20/shared
            - setfacl -R -m default:other::--- /mnt/exos20/shared
            - setfacl -m user:nobody:--x /mnt/exos20/shared
            - setfacl -R -m group::--- /mnt/exos20/shared
            - setfacl -R -m default:group::--- /mnt/exos20/shared

            - zfs set acltype=posixacl exos20/artifactory-backup
            - zfs set xattr=sa exos20/artifactory-backup
            - setfacl -bR /mnt/exos20/artifactory-backup
            - chown -R artifactory-system /mnt/exos20/artifactory-backup
            - find /mnt/exos20/artifactory-backup -type d -exec chmod 700 {} +
            - find /mnt/exos20/artifactory-backup -type f -exec chmod 600 {} +
            - setfacl -R -m user:nas_admin:rwx /mnt/exos20/artifactory-backup
            - setfacl -R -m default:user:nas_admin:rwx /mnt/exos20/artifactory-backup
            - setfacl -R -m other::--- /mnt/exos20/artifactory-backup
            - setfacl -R -m default:other::--- /mnt/exos20/artifactory-backup
            - setfacl -m user:nobody:--x /mnt/exos20/artifactory-backup
            - setfacl -R -m group::--- /mnt/exos20/artifactory-backup
            - setfacl -R -m default:group::--- /mnt/exos20/artifactory-backup

            - exportfs -ra
            - systemctl enable nfs-kernel-server
            - printf '%s\n%s\n' '{{ .DARKFELLA_SMB_PASSWORD }}' '{{ .DARKFELLA_SMB_PASSWORD }}' | smbpasswd -a -s darkfella
            - smbpasswd -e darkfella
            - systemctl enable --now smbd
            - systemctl enable --now wsdd-server

            - systemctl enable --now smartmontools.service
            - systemctl enable --now zfs-scrub.timer

            - wget -qO- https://github.com/pdf/zfs_exporter/releases/download/v2.3.12/zfs_exporter-2.3.12.linux-amd64.tar.gz | tar -xzvC /usr/local/bin --strip-components=1 zfs_exporter-2.3.12.linux-amd64/zfs_exporter
            - chmod +x /usr/local/bin/zfs_exporter
            - systemctl enable --now zfs_exporter

          power_state:
            mode: reboot
            message: Cloud-init setup complete, rebooting
            timeout: 30
            condition: true

  dataFrom:
    - extract:
        key: kv/nas-admin
