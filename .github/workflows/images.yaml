---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - images/**
      - .github/workflows/images.yaml
  push:
    branches:
      - main
    paths:
      - images/**
      - .github/workflows/images.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  filter:
    name: Images - Filter
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all=$(find images -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | xargs -n1 basename | sort -u)
          base="${PR_BASE:-$PUSH_BEFORE}"

          # Build everything on manual runs, brand-new branches, or when this workflow itself changed
          if [ "$EVENT" = "workflow_dispatch" ] \
            || [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || git diff --name-only "$base" "$HEAD_SHA" | grep -qx '.github/workflows/images.yaml'; then
            names="$all"
          else
            changed=$(git diff --name-only "$base" "$HEAD_SHA" -- images | cut -d/ -f2 | sort -u)
            names=$(for n in $changed; do [ -f "images/$n/Dockerfile" ] && echo "$n"; done || true)
          fi

          if [ -z "$names" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"image":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(printf '%s\n' $names | jq -R . | jq -sc '{image: .}')" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Images - Build ${{ matrix.image }}
    needs: filter
    if: ${{ needs.filter.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    strategy:
      matrix: ${{ fromJSON(needs.filter.outputs.matrix) }}
      fail-fast: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Version
        id: version
        env:
          NAME: ${{ matrix.image }}
        run: |
          # Version = first "ARG <something>VERSION=<value>" line in the Dockerfile
          version=$(sed -nE 's/^ARG [A-Z_]*VERSION=(.+)$/\1/p' "images/${NAME}/Dockerfile" | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VENDOR=${{ github.repository_owner }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install Cosign
        if: ${{ env.PUSH == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign Image
        if: ${{ env.PUSH == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  success:
    if: ${{ !cancelled() }}
    needs: build
    name: Images - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
