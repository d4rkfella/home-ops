---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: qui-secret
    template:
      data:
        QUI__OIDC_CLIENT_SECRET: "{{ .QUI_OIDC_CLIENT_SECRET }}"
        QUI__DATABASE_PASSWORD: "{{ .QUI_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: kv/qui
