---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/k8s.keycloak.org/keycloak_v2beta1.json
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
spec:
  unsupported:
    podTemplate:
      spec:
        volumes:
          - name: tmpfs
            emptyDir: {}
          - name: data
            emptyDir: {}
        containers:
          - name: keycloak
            volumeMounts:
              - name: data
                mountPath: /usr/share/java/keycloak/data
              - name: tmpfs
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        securityContext:
          runAsUser: 65532
          runAsGroup: 65532
          runAsNonRoot: true
        hostUsers: false
  db:
    vendor: postgres
    usernameSecret:
      name: &secret keycloak-secret
      key: KEYCLOAK__POSTGRES__USER
    passwordSecret:
      name: *secret
      key: KEYCLOAK__POSTGRES__PASSWORD
    host: postgres-db-rw.database.svc.cluster.local
    database: keycloak
    port: 5432
    schema: public
  instances: 1
  image: ghcr.io/d4rkfella/keycloak:26.8.2@sha256:9f2963b697590543b08b9b50fff53caf17b8739b0bd3b99fb07d62b23711ce9b
  startOptimized: true
  proxy:
    headers: xforwarded
  hostname:
    hostname: https://accounts.darkfella.space
    admin: https://keycloak-admin.darkfella.space
  http:
    httpEnabled: true
    httpPort: 8080
  ingress:
    enabled: false
