---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
{
  # yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "silence-operator",
  },
  spec: {
    chartRef: {
      kind: "OCIRepository",
      name: "silence-operator",
    },
    interval: "1h",
    values: {
      alertmanagerAddress: "https://alertmanager-operated.observability.svc.cluster.local:9093",
      networkPolicy: {
        enabled: false,
      },
    },
  },
}
