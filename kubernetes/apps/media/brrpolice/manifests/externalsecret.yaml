---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
{
  apiVersion: "external-secrets.io/v1",
  kind: "ExternalSecret",
  metadata: {
    name: "brrpolice",
  },
  spec: {
    secretStoreRef: {
      kind: "ClusterSecretStore",
      name: "openbao",
    },
    target: {
      name: "brrpolice-secret",
      template: {
        data: {
          BRRPOLICE_QBITTORRENT__API_KEY: "{{ .QBITTORRENT_API_KEY }}",
        },
      },
    },
    dataFrom: [{
      extract: {
        key: "kv/brrpolice",
      },
    }],
  },
}
