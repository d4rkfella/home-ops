---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kometa-quickstart
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kometa-quickstart-secret
    template:
      data:
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: kv/kometa-quickstart
