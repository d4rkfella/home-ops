---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
{
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "bazarr",
  },
  spec: {
    interval: "1h",
    chartRef: {
      kind: "OCIRepository",
      name: "bazarr",
    },
    values: {
      controllers: {
        bazarr: {
          annotations: {
            reloader.stakater.com/auto: "true",
          },
          containers: {
            app: {
              image: {
                repository: "ghcr.io/d4rkfella/bazarr",
                tag: "1.6.1_beta34@sha256:45c4b22139b08ace4e6e4f80370c1ad020ae4242cd99ff89b1feb11cd8092482",
              },
              env: {
                TZ: "Europe/Sofia",
                POSTGRES_ENABLED: "true",
                POSTGRES_HOST: "postgres-db-rw.database.svc.cluster.local",
                POSTGRES_PORT: 5432,
                POSTGRES_DATABASE: "{{ .Release.Name }}",
                POSTGRES_USERNAME: {
                  valueFrom: {
                    secretKeyRef: {
                      name: "{{ .Release.Name }}-secret",
                      key: "POSTGRES_USERNAME",
                    },
                  },
                },
                POSTGRES_PASSWORD: {
                  valueFrom: {
                    secretKeyRef: {
                      name: "{{ .Release.Name }}-secret",
                      key: "POSTGRES_PASSWORD",
                    },
                  },
                },
              },
              probes: {
                startup: {
                  enabled: true,
                  spec: {
                    periodSeconds: 30,
                    failureThreshold: 10,
                  },
                },
                liveness: {
                  enabled: true,
                  spec: {
                    periodSeconds: 30,
                    timeoutSeconds: 5,
                    failureThreshold: 5,
                  },
                },
                readiness: {
                  enabled: true,
                  custom: true,
                  spec: {
                    httpGet: {
                      path: "/api/system/ping",
                      port: 6767,
                    },
                    periodSeconds: 10,
                    timeoutSeconds: 5,
                    failureThreshold: 5,
                  },
                },
              },
              securityContext: {
                allowPrivilegeEscalation: false,
                readOnlyRootFilesystem: true,
                capabilities: {
                  drop: [
                    "ALL",
                  ],
                },
              },
              resources: {
                requests: {
                  cpu: "10m",
                },
                limits: {
                  memory: "4Gi",
                },
              },
            },
          },
        },
      },
      defaultPodOptions: {
        securityContext: {
          runAsNonRoot: true,
          runAsUser: 65532,
          runAsGroup: 65532,
          fsGroup: 65532,
          fsGroupChangePolicy: "OnRootMismatch",
          seccompProfile: {
            type: "RuntimeDefault",
          },
        },
      },
      service: {
        app: {
          controller: "bazarr",
          ports: {
            http: {
              port: 6767,
            },
          },
        },
      },
      route: {
        app: {
          hostnames: [
            "bazarr.darkfellanetwork.com",
          ],
          parentRefs: [{
            name: "internal",
            namespace: "envoy-gateway-system",
            sectionName: "https",
          }],
          rules: [{
            backendRefs: [{
              name: "bazarr",
              port: 6767,
            }],
          }],
        },
      },
      persistence: {
        config: {
          existingClaim: "bazarr",
          globalMounts: [{
            path: "/config",
          }],
        },
        log: {
          type: "emptyDir",
          globalMounts: [{
            path: "/config/log",
          }],
        },
        cache: {
          type: "emptyDir",
          globalMounts: [{
            path: "/config/cache",
          }],
        },
        tmp: {
          type: "emptyDir",
        },
        media: {
          type: "nfs",
          server: "192.168.91.40",
          path: "/mnt/exos20/data/media",
          globalMounts: [{
            path: "/data/media",
          }],
        },
      },
    },
  },
}
