---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
{
  apiVersion: "helm.toolkit.fluxcd.io/v2",
  kind: "HelmRelease",
  metadata: {
    name: "flaresolverr",
  },
  spec: {
    interval: "1h",
    chartRef: {
      kind: "OCIRepository",
      name: "flaresolverr",
    },
    values: {
      controllers: {
        flaresolverr: {
          containers: {
            app: {
              image: {
                repository: "ghcr.io/flaresolverr/flaresolverr",
                tag: "v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47",
              },
              env: {
                TZ: "Europe/Sofia",
                PORT: 80,
                HOST: "0.0.0.0",
                TEST_URL: "https://www.google.com",
                BROWSER_TIMEOUT: 40000,
                HEADLESS: true,
                LOG_LEVEL: "info",
                LOG_HTML: false,
                CAPTCHA_SOLVER: "none",
              },
              probes: {
                liveness: {
                  enabled: true,
                  spec: {
                    periodSeconds: 30,
                    timeoutSeconds: 5,
                    failureThreshold: 5,
                  },
                },
                readiness: {
                  enabled: true,
                  custom: true,
                  spec: {
                    httpGet: {
                      path: "/health",
                      port: 80,
                    },
                    periodSeconds: 10,
                    timeoutSeconds: 5,
                    failureThreshold: 5,
                  },
                },
                startup: {
                  enabled: true,
                  spec: {
                    failureThreshold: 30,
                    periodSeconds: 10,
                  },
                },
              },
              securityContext: {
                allowPrivilegeEscalation: false,
                readOnlyRootFilesystem: false,
                capabilities: {
                  drop: [
                    "ALL",
                  ],
                },
              },
              resources: {
                requests: {
                  cpu: "10m",
                },
                limits: {
                  memory: "1024Mi",
                },
              },
            },
          },
        },
      },
      defaultPodOptions: {
        hostUsers: false,
        securityContext: {
          runAsNonRoot: true,
          runAsUser: 1000,
          runAsGroup: 1000,
          fsGroup: 1000,
          fsGroupChangePolicy: "OnRootMismatch",
          seccompProfile: {
            type: "RuntimeDefault",
          },
        },
      },
      service: {
        app: {
          controller: "flaresolverr",
          ports: {
            http: {
              port: 80,
            },
          },
        },
      },
      persistence: {
        tmp: {
          type: "emptyDir",
        },
      },
    },
  },
}
