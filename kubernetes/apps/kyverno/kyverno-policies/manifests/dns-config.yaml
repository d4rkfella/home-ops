---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-ndots
spec:
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              dnsConfig: Object.spec.dnsConfig{
                options: [
                  Object.spec.dnsConfig.options{
                    name: "ndots",
                    value: "1"
                  }
                ]
              }
            }
          }
