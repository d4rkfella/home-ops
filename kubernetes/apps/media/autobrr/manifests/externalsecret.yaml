---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: autobrr-secret
    template:
      data:
        AUTOBRR__OIDC_CLIENT_SECRET: "{{ .AUTOBRR_OIDC_CLIENT_SECRET }}"
        AUTOBRR__POSTGRES_PASSWORD: "{{ .AUTOBRR_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: kv/autobrr
