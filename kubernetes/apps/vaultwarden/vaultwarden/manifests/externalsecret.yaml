---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vaultwarden-secret
    template:
      data:
        SMTP_USERNAME: "{{ .VAULTWARDEN_SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .VAULTWARDEN_SMTP_PASSWORD }}"
        PUSH_INSTALLATION_ID: "{{ .VAULTWARDEN_PUSH_INSTALLATION_ID }}"
        PUSH_INSTALLATION_KEY: "{{ .VAULTWARDEN_PUSH_INSTALLATION_KEY }}"
        SSO_CLIENT_SECRET: "{{ .VAULTWARDEN_OIDC_CLIENT_SECRET }}"
        DATABASE_URL: postgresql://vaultwarden:{{ .VAULTWARDEN_POSTGRES_PASSWORD | urlquery }}@postgres-db-rw.database.svc.cluster.local:5432/vaultwarden?sslmode=disable
        ADMIN_TOKEN: "{{ .VAULTWARDEN_ADMIN_TOKEN }}"
  dataFrom:
    - extract:
        key: kv/vaultwarden
