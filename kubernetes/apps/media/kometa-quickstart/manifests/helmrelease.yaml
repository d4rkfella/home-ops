---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kometa-quickstart
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kometa-quickstart
  values:
    controllers:
      kometa-quickstart:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: kometateam/quickstart
              tag: develop@sha256:3178c0666271e959349be4d57bd30d6fe9c039f23971a2b395594c78c4b3cd0c
            env:
              TZ: Europe/Sofia
            probes:
              startup:
                enabled: true
                spec:
                  periodSeconds: 30
                  failureThreshold: 10
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 7171
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kometa-quickstart
        ports:
          http:
            port: 7171
    route:
      app:
        hostnames:
          - kometa-quickstart.darkfellanetwork.com
        parentRefs:
          - name: internal
            namespace: envoy-gateway-system
            sectionName: https
        rules:
          - backendRefs:
              - name: kometa-quickstart
                port: 7171
    persistence:
      config:
        existingClaim: kometa-quickstart
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
