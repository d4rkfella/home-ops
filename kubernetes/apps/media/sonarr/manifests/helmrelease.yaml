---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sonarr
  values:
    controllers:
      sonarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2997@sha256:05acf764e72fa458b5edf236771d7a08d1f120fce509d4fb8a4e799fae29fda7
            env:
              SONARR__APP__INSTANCENAME: Sonarr
              SONARR__APP__THEME: dark
              SONARR__AUTH__METHOD: Oidc
              SONARR__AUTH__OIDCAUTHORITY: https://accounts.darkfella.space/realms/DarkfellaNET
              SONARR__AUTH__OIDCCLIENTID: "{{ .Release.Name }}"
              SONARR__AUTH__OIDCUSERIDENTIFIER: darkfella91@gmail.com
              SONARR__AUTH__OIDCSCOPES: "openid profile email"
              SONARR__LOG__DBENABLED: "False"
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__ALLOWEDHOSTS: sonarr.darkfella.space,sonarr.media.svc.cluster.local
              SONARR__SERVER__TRUSTEDNETWORKS: 172.16.0.0/16
              SONARR__SERVER__PORT: &port 80
              SONARR__UPDATE__BRANCH: develop
              SONARR__POSTGRES__HOST: postgres-db-rw.database.svc.cluster.local
              SONARR__POSTGRES__MAINDB: "{{ .Release.Name }}"
              TZ: Europe/Sofia
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    httpHeaders:
                      - name: Host
                        value: localhost
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.darkfella.space"
        parentRefs:
          - name: internal
            namespace: envoy-gateway-system
    persistence:
      config:
        type: persistentVolumeClaim
        size: 15Gi
        accessMode: ReadWriteOnce
      media:
        type: nfs
        server: 192.168.91.40
        path: /mnt/exos20/data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
