
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: mount-internal-ca
spec:
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: mount-internal-ca-enabled
      expression: >-
        object.metadata.?annotations[
          'security.darkfellanetwork.com/mount-internal-ca'
        ].orValue('') == 'true'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          (
            has(object.spec.volumes)
            ? (
                object.spec.volumes.exists(v, v.name == "internal-ca")
                ? []
                : [JSONPatch{
                    op: "add",
                    path: "/spec/volumes/-",
                    value: Object.spec.volumes{
                      name: "internal-ca",
                      secret: Object.spec.volumes.secret{
                        secretName: "internal-ca-secret"
                      }
                    }
                  }]
              )
            : [JSONPatch{
                op: "add",
                path: "/spec/volumes",
                value: [
                  Object.spec.volumes{
                    name: "internal-ca",
                    secret: Object.spec.volumes.secret{
                      secretName: "internal-ca-secret"
                    }
                  }
                ]
              }]
          )
          +
          object.spec.containers.filter(c,
            has(c.volumeMounts) &&
            !c.volumeMounts.exists(m, m.name == "internal-ca")
          ).map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" +
                string(object.spec.containers.indexOf(c)) +
                "/volumeMounts/-",
              value: Object.spec.containers.volumeMounts{
                name: "internal-ca",
                mountPath: "/etc/ssl/certs/internal-ca.crt",
                subPath: "ca.crt",
                readOnly: true
              }
            }
          )
          +
          object.spec.containers.filter(c, !has(c.volumeMounts)).map(c,
            JSONPatch{
              op: "add",
              path: "/spec/containers/" +
                string(object.spec.containers.indexOf(c)) +
                "/volumeMounts",
              value: [
                Object.spec.containers.volumeMounts{
                  name: "internal-ca",
                  mountPath: "/etc/ssl/certs/internal-ca.crt",
                  subPath: "ca.crt",
                  readOnly: true
                }
              ]
            }
          )
          +
          (
            has(object.spec.initContainers)
            ? (
                object.spec.initContainers.filter(c,
                  has(c.volumeMounts) &&
                  !c.volumeMounts.exists(m, m.name == "internal-ca")
                ).map(c,
                  JSONPatch{
                    op: "add",
                    path: "/spec/initContainers/" +
                      string(object.spec.initContainers.indexOf(c)) +
                      "/volumeMounts/-",
                    value: Object.spec.initContainers.volumeMounts{
                      name: "internal-ca",
                      mountPath: "/etc/ssl/certs/internal-ca.crt",
                      subPath: "ca.crt",
                      readOnly: true
                    }
                  }
                )
                +
                object.spec.initContainers.filter(c, !has(c.volumeMounts)).map(c,
                  JSONPatch{
                    op: "add",
                    path: "/spec/initContainers/" +
                      string(object.spec.initContainers.indexOf(c)) +
                      "/volumeMounts",
                    value: [
                      Object.spec.initContainers.volumeMounts{
                        name: "internal-ca",
                        mountPath: "/etc/ssl/certs/internal-ca.crt",
                        subPath: "ca.crt",
                        readOnly: true
                      }
                    ]
                  }
                )
              )
            : []
          )
---
