---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: recyclarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: recyclarr
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 1m
