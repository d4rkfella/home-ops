---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 1h
  values:
    controllers:
      qui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.36.0@sha256:ecfd0f508f951f038b590f4fcfd33177d2ce0a8d4d33d86864b0d96e917caf59
            env:
              QUI__CHECK_FOR_UPDATES: false
              QUI__HOST: 0.0.0.0
              QUI__PORT: 80
              QUI__DATABASE_ENGINE: postgres
              QUI__DATABASE_HOST: postgres-db-rw.database.svc.cluster.local
              QUI__DATABASE_PORT: 5432
              QUI__DATABASE_DATABASE: "{{ .Release.Name }}"
              QUI__DATABASE_USER: "{{ .Release.Name }}"
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
              QUI__OIDC_ENABLED: "true"
              QUI__OIDC_ISSUER: https://accounts.darkfella.space/realms/DarkfellaNET
              QUI__OIDC_CLIENT_ID: "{{ .Release.Name }}"
              QUI__OIDC_REDIRECT_URL: https://qui.darkfella.space/api/auth/oidc/callback
              QUI__OIDC_ALLOWED_EMAIL: darkfella91@gmail.com
              TZ: Europe/Sofia
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      annotations:
        security.darkfella.space/mount-postgres-ca: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.darkfella.space"
        parentRefs:
          - name: internal
            namespace: envoy-gateway-system
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
      media:
        type: nfs
        server: 192.168.91.40
        path: /mnt/exos20/data
        globalMounts:
          - path: /data
