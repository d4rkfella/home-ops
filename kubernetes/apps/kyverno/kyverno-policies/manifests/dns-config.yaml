---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-ndots
spec:
  autogen:
    podControllers:
      controllers: []

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          !has(object.spec.dnsConfig)
          ?
          [
            JSONPatch{
              op: "add",
              path: "/spec/dnsConfig",
              value: Object.spec.dnsConfig{
                options: [
                  Object.spec.dnsConfig.options{
                    name: "ndots",
                    value: "1"
                  }
                ]
              }
            }
          ]
          :
          !has(object.spec.dnsConfig.options)
          ?
          [
            JSONPatch{
              op: "add",
              path: "/spec/dnsConfig/options",
              value: [
                Object.spec.dnsConfig.options{
                  name: "ndots",
                  value: "1"
                }
              ]
            }
          ]
          :
          object.spec.dnsConfig.options.exists(o, o.name == "ndots")
          ?
          [
            JSONPatch{
              op: "replace",
              path: "/spec/dnsConfig/options/" +
                string(
                  object.spec.dnsConfig.options.map(o, o.name).indexOf("ndots")
                ),
              value: Object.spec.dnsConfig.options{
                name: "ndots",
                value: "1"
              }
            }
          ]
          :
          [
            JSONPatch{
              op: "add",
              path: "/spec/dnsConfig/options/-",
              value: Object.spec.dnsConfig.options{
                name: "ndots",
                value: "1"
              }
            }
          ]
