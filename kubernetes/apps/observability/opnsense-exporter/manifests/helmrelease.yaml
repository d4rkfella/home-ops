---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opnsense-exporter
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: opnsense-exporter
  values:
    controllers:
      opnsense-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/d4rkfella/opnsense-exporter
              tag: 0.0.17@sha256:ccb207d90f046279b318d387543ca0f557015a13de3b5690fb779a4ee9f46dc9
              pullPolicy: IfNotPresent
            args:
              - --runtime.gomaxprocs=2
              - --opnsense.protocol=https
              - --opnsense.address=router.darkfellanetwork.com
              - --web.listen-address=:8080
              - --web.config.file=/etc/web-config.yaml
              - --exporter.disable-openvpn
              - --exporter.instance-label=router
            env:
              TZ: Europe/Sofia
              OPNSENSE_EXPORTER_OPS_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: opnsense-exporter-secret
                    key: key
              OPNSENSE_EXPORTER_OPS_API_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: opnsense-exporter-secret
                    key: secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 1Gi
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
    service:
      app:
        controller: opnsense-exporter
        ports:
          http:
            port: 8080
    serviceMonitor:
      app:
        serviceName: opnsense-exporter
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
            basicAuth:
              username:
                name: opnsense-exporter-secret
                key: username
              password:
                name: opnsense-exporter-secret
                key: password

    persistence:
      web-config:
        type: secret
        name: opnsense-exporter-secret
        globalMounts:
          - path: /etc/web-config.yaml
            subPath: web-config.yaml
            readOnly: true
