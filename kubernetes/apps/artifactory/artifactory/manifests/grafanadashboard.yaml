  kind: "GrafanaDashboard",
  metadata: {
    name: "artifactory-metrics",
  },
  spec: {
    allowCrossNamespaceImport: true,
    instanceSelector: {
      matchLabels: {
        grafana.internal/instance: "grafana",
      },
    },
    url: "https://raw.githubusercontent.com/jfrog/log-analytics-prometheus/refs/heads/master/grafana/ArtifactoryMetrics.json",
