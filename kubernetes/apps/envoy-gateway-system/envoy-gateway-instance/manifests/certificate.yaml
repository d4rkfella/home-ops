---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: darkfellanet
spec:
  secretName: darkfellanet-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    encoding: PKCS8
    size: 256
  commonName: darkfella.space
  dnsNames:
    - darkfella.space
    - "*.darkfella.space"
