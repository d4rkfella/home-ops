name: OpenBao bootstrap E2E

on:
  pull_request:
    paths:
      - ".github/workflows/openbao-bootstrap-e2e.yaml"
      - "tools/openbao-bootstrap/bootstrap.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/openbao-bootstrap-e2e.yaml"
      - "tools/openbao-bootstrap/bootstrap.sh"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBAO_NAMESPACE: openbao
  BAO_TLS_SERVER_NAME: openbao.local
  BAO_CACERT: /tmp/openbao-e2e/ca.crt

  SNAPSHOT_BUCKET: openbao-snapshots
  SNAPSHOT_PREFIX: bao_

  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://127.0.0.1:9000

jobs:
  e2e:
    name: OpenBao bootstrap / snapshot restore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create k3d Kubernetes cluster
        uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee
        with:
          k3d-name: openbao-e2e
          k3d-tag: v5.9.0
          version: v1.37.0+k3s1
          k3d-args: >-
            --agents 2
            --servers 1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Verify test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          aws --version
          kubectl version --client
          helm version

      - name: Start MinIO
        shell: bash
        run: |
          set -Eeuo pipefail

          docker run \
            --detach \
            --name openbao-minio \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --console-address ":9001"

          for _ in {1..120}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:9000/minio/health/ready >/dev/null

          for _ in {1..30}; do
            if aws s3api create-bucket --bucket "${SNAPSHOT_BUCKET}" --endpoint-url "${AWS_ENDPOINT_URL}"; then
              break
            fi
            sleep 2
          done

          aws s3api head-bucket --bucket "${SNAPSHOT_BUCKET}" --endpoint-url "${AWS_ENDPOINT_URL}"

      - name: Write common helper scripts
        shell: bash
        run: |
          mkdir -p /tmp/openbao-e2e/bin

          # Script 1: Execute bao command inside pod with standard env
          cat <<'EOF' > /tmp/openbao-e2e/bin/bao-exec.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail

          POD="$1"
          shift

          kubectl exec -n "${OPENBAO_NAMESPACE}" "${POD}" -- env \
            BAO_ADDR="https://127.0.0.1:8200" \
            BAO_TLS_SERVER_NAME="${BAO_TLS_SERVER_NAME}" \
            BAO_CACERT="/openbao/userconfig/openbao-server-tls/ca.crt" \
            "$@"
          EOF

          # Script 2: Unseal sequence for target pod(s)
          cat <<'EOF' > /tmp/openbao-e2e/bin/unseal-cluster.sh
          #!/usr/bin/env bash
          set -Eeuo pipefail

          INIT_FILE="/tmp/openbao-e2e/source-init.json"
          test -f "${INIT_FILE}"

          UNSEAL_THRESHOLD="$(jq -r '.unseal_threshold' "${INIT_FILE}")"
          mapfile -t UNSEAL_KEYS < <(jq -r ".unseal_keys_b64[:${UNSEAL_THRESHOLD}][]" "${INIT_FILE}")

          if (( ${#UNSEAL_KEYS[@]} != UNSEAL_THRESHOLD )); then
            echo "ERROR: expected ${UNSEAL_THRESHOLD} unseal keys, got ${#UNSEAL_KEYS[@]}" >&2
            exit 1
          fi

          wait_for_running() {
            local pod="$1"
            echo "Waiting for ${pod} to be Running..."
            until kubectl get pod -n "${OPENBAO_NAMESPACE}" "${pod}" >/dev/null 2>&1; do sleep 2; done
            kubectl wait -n "${OPENBAO_NAMESPACE}" --for=jsonpath='{.status.phase}'=Running "pod/${pod}" --timeout=180s
          }

          unseal_node() {
            local pod="$1"
            echo "========================================"
            echo "Unsealing node: ${pod}"
            echo "========================================"

            for key in "${UNSEAL_KEYS[@]}"; do
              /tmp/openbao-e2e/bin/bao-exec.sh "${pod}" bao operator unseal "${key}" || true
            done

            local timeout=90 elapsed=0 status=""
            while (( elapsed < timeout )); do
              if status="$(/tmp/openbao-e2e/bin/bao-exec.sh "${pod}" bao status -format=json 2>/dev/null)" && [[ -n "${status}" ]]; then
                if jq -e '.initialized == true and .sealed == false' >/dev/null <<<"${status}"; then
                  echo "${pod} is confirmed unsealed"
                  return 0
                fi
              fi
              sleep 2
              elapsed=$((elapsed + 2))
            done

            echo "ERROR: ${pod} failed to unseal within ${timeout}s" >&2
            return 1
          }

          # Target pods provided as arguments, or query all namespace pods if empty
          PODS=("$@")
          if (( ${#PODS[@]} == 0 )); then
            mapfile -t PODS < <(kubectl get pods -n "${OPENBAO_NAMESPACE}" -l app.kubernetes.io/name=openbao -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sed '/^$/d' | sort)
          fi

          for pod in "${PODS[@]}"; do
            wait_for_running "${pod}"
            unseal_node "${pod}"
          done
          EOF

          chmod +x /tmp/openbao-e2e/bin/*.sh

      - name: Generate test CA and OpenBao TLS certificate
        shell: bash
        run: |
          set -Eeuo pipefail

          openssl genrsa -out /tmp/openbao-e2e/ca.key 4096
          openssl req -x509 -new -nodes -key /tmp/openbao-e2e/ca.key -sha256 -days 1 \
            -out /tmp/openbao-e2e/ca.crt -subj "/CN=OpenBao E2E CA"

          openssl genrsa -out /tmp/openbao-e2e/tls.key 2048

          cat >/tmp/openbao-e2e/server.cnf <<'EOF'
          [req]
          distinguished_name = req_distinguished_name
          req_extensions = v3_req
          prompt = no

          [req_distinguished_name]
          CN = openbao.local

          [v3_req]
          subjectAltName = @alt_names
          extendedKeyUsage = serverAuth,clientAuth
          keyUsage = digitalSignature,keyEncipherment

          [alt_names]
          DNS.1 = openbao.local
          DNS.2 = openbao
          DNS.3 = openbao.openbao.svc
          DNS.4 = openbao.openbao.svc.cluster.local
          DNS.5 = openbao-internal
          DNS.6 = openbao-internal.openbao.svc
          DNS.7 = openbao-internal.openbao.svc.cluster.local
          DNS.8 = openbao-0.openbao-internal
          DNS.9 = openbao-0.openbao-internal.openbao.svc
          DNS.10 = openbao-0.openbao-internal.openbao.svc.cluster.local
          DNS.11 = openbao-1.openbao-internal
          DNS.12 = openbao-1.openbao-internal.openbao.svc
          DNS.13 = openbao-1.openbao-internal.openbao.svc.cluster.local
          DNS.14 = openbao-2.openbao-internal
          DNS.15 = openbao-2.openbao-internal.openbao.svc
          DNS.16 = openbao-2.openbao-internal.openbao.svc.cluster.local
          EOF

          openssl req -new -key /tmp/openbao-e2e/tls.key -out /tmp/openbao-e2e/tls.csr -config /tmp/openbao-e2e/server.cnf
          openssl x509 -req -in /tmp/openbao-e2e/tls.csr -CA /tmp/openbao-e2e/ca.crt -CAkey /tmp/openbao-e2e/ca.key \
            -CAcreateserial -out /tmp/openbao-e2e/tls.crt -days 1 -sha256 -extensions v3_req -extfile /tmp/openbao-e2e/server.cnf

          kubectl create namespace "${OPENBAO_NAMESPACE}"
          kubectl create secret generic openbao-server-tls \
            -n "${OPENBAO_NAMESPACE}" \
            --from-file=tls.crt=/tmp/openbao-e2e/tls.crt \
            --from-file=tls.key=/tmp/openbao-e2e/tls.key \
            --from-file=ca.crt=/tmp/openbao-e2e/ca.crt

      - name: Install OpenBao
        shell: bash
        run: |
          set -Eeuo pipefail

          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo update

          cat >/tmp/openbao-e2e/values.yaml <<'EOF'
          global:
            enabled: true
            tlsDisable: false
          injector:
            enabled: false
          server:
            enabled: true
            image:
              registry: ghcr.io
              repository: openbao/openbao
              tag: 2.7.0-beta20260909
            serviceAccount:
              create: true
            volumes:
              - name: openbao-server-tls
                secret:
                  secretName: openbao-server-tls
            volumeMounts:
              - name: openbao-server-tls
                mountPath: /openbao/userconfig/openbao-server-tls
                readOnly: true
            extraEnvironmentVars:
              BAO_CACERT: /openbao/userconfig/openbao-server-tls/ca.crt
            ha:
              enabled: true
              replicas: 3
              apiAddr: https://openbao.local:8200
              raft:
                enabled: true
                setNodeId: true
                config: |
                  ui = true
                  listener "tcp" {
                    tls_disable = 0
                    tls_min_version = "tls13"
                    tls_cert_file = "/openbao/userconfig/openbao-server-tls/tls.crt"
                    tls_key_file  = "/openbao/userconfig/openbao-server-tls/tls.key"
                    address = "[::]:8200"
                    cluster_address = "[::]:8201"
                  }
                  storage "raft" {
                    path = "/openbao/data"
                    retry_join {
                      leader_api_addr = "https://openbao-active:8200"
                      leader_ca_cert_file     = "/openbao/userconfig/openbao-server-tls/ca.crt"
                      leader_client_cert_file = "/openbao/userconfig/openbao-server-tls/tls.crt"
                      leader_client_key_file = "/openbao/userconfig/openbao-server-tls/tls.key"
                      leader_tls_servername = "openbao.local"
                    }
                  }
                  service_registration "kubernetes" {}
          EOF

          helm upgrade --install openbao openbao/openbao \
            --namespace "${OPENBAO_NAMESPACE}" \
            --values /tmp/openbao-e2e/values.yaml \
            --wait=false

      - name: Resolve first OpenBao pod with Running status
        id: resolve_init_target_pod
        shell: bash
        run: |
          set -Eeuo pipefail

          kubectl wait \
            -n "${OPENBAO_NAMESPACE}" \
            --for=create \
            --for=jsonpath='{.status.phase}'=Running \
            --timeout=2m \
            pod -l app.kubernetes.io/name=openbao,component=server

          pod="$(kubectl get pods \
            -n "${OPENBAO_NAMESPACE}" \
            -l app.kubernetes.io/name=openbao,component=server \
            --field-selector status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')"

          echo "name=${pod}" >> "$GITHUB_OUTPUT"

      - name: Initialize and unseal first OpenBao node
        shell: bash
        run: |
          set -Eeuo pipefail

          INIT_POD="${{ steps.resolve_init_target_pod.outputs.name }}"

          /tmp/openbao-e2e/bin/bao-exec.sh "${INIT_POD}" bao operator init -format=json > /tmp/openbao-e2e/source-init.json
          jq -r '.root_token' /tmp/openbao-e2e/source-init.json > /tmp/openbao-e2e/source-root-token
          chmod 600 /tmp/openbao-e2e/source-root-token

          /tmp/openbao-e2e/bin/unseal-cluster.sh "${INIT_POD}"

      - name: Unseal follower nodes
        shell: bash
        run: |
          set -Eeuo pipefail

          /tmp/openbao-e2e/bin/unseal-cluster.sh openbao-1 openbao-2

          TOKEN="$(cat /tmp/openbao-e2e/source-root-token)"
          /tmp/openbao-e2e/bin/bao-exec.sh openbao-0 env BAO_TOKEN="${TOKEN}" bao operator raft list-peers

      - name: Create known source secret
        shell: bash
        run: |
          set -Eeuo pipefail

          TOKEN="$(cat /tmp/openbao-e2e/source-root-token)"

          /tmp/openbao-e2e/bin/bao-exec.sh openbao-0 env BAO_TOKEN="${TOKEN}" bao secrets enable -path=secret kv-v2
          /tmp/openbao-e2e/bin/bao-exec.sh openbao-0 env BAO_TOKEN="${TOKEN}" bao kv put -mount=secret e2e value="snapshot-restore-e2e" source="github-actions"

      - name: Create source Raft snapshot
        shell: bash
        run: |
          set -Eeuo pipefail

          TOKEN="$(cat /tmp/openbao-e2e/source-root-token)"
          mkdir -p /tmp/openbao-e2e

          POD="$(kubectl get pods \
            -n "${OPENBAO_NAMESPACE}" \
            -l app.kubernetes.io/name=openbao,component=server \
            --field-selector status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')"

          /tmp/openbao-e2e/bin/bao-exec.sh "${POD}" bash -c "
            set -e
            env BAO_TOKEN=\"${TOKEN}\" bao operator raft snapshot save /tmp/e2e.snapshot >/dev/null
            cat /tmp/e2e.snapshot
            rm -f /tmp/e2e.snapshot
          " > /tmp/openbao-e2e/e2e.snapshot

          test -s /tmp/openbao-e2e/e2e.snapshot

      - name: Upload snapshot to test S3
        shell: bash
        run: |
          set -Eeuo pipefail

          aws s3 cp /tmp/openbao-e2e/e2e.snapshot "s3://${SNAPSHOT_BUCKET}/${SNAPSHOT_PREFIX}e2e.snapshot"
          aws s3api head-object --bucket "${SNAPSHOT_BUCKET}" --key "${SNAPSHOT_PREFIX}e2e.snapshot"

      - name: Destroy source OpenBao storage
        shell: bash
        run: |
          set -Eeuo pipefail

          helm uninstall openbao -n "${OPENBAO_NAMESPACE}" --wait
          kubectl delete pvc -n "${OPENBAO_NAMESPACE}" --all --wait=true

      - name: Install fresh OpenBao cluster
        shell: bash
        run: |
          set -Eeuo pipefail

          helm upgrade --install openbao openbao/openbao \
            --namespace "${OPENBAO_NAMESPACE}" \
            --values /tmp/openbao-e2e/values.yaml \
            --wait=false

      - name: Install OpenBao CLI
        shell: bash
        run: |
          set -Eeuo pipefail

          BAO_VERSION="2.7.0-beta20260909"
          curl -fsSL "https://github.com/openbao/openbao/releases/download/v${BAO_VERSION}/openbao_${BAO_VERSION}_linux_amd64.tar.gz" -o "/tmp/openbao.tar.gz"
          mkdir -p /tmp/openbao-cli && tar -xzf "/tmp/openbao.tar.gz" -C /tmp/openbao-cli
          sudo install -m 0755 /tmp/openbao-cli/bao /usr/local/bin/bao

      - name: Run OpenBao bootstrap script
        shell: bash
        run: |
          set -Eeuo pipefail

          ./tools/openbao-bootstrap/bootstrap.sh "${OPENBAO_NAMESPACE}"

      - name: Unseal restored OpenBao cluster
        shell: bash
        run: |
          set -Eeuo pipefail

          /tmp/openbao-e2e/bin/unseal-cluster.sh

      - name: Verify restored secret
        shell: bash
        run: |
          set -Eeuo pipefail

          TOKEN="$(cat /tmp/openbao-e2e/source-root-token)"

          echo "Waiting for active OpenBao pod..."
          for _ in {1..60}; do
            ACTIVE_POD="$(kubectl get pods -n "${OPENBAO_NAMESPACE}" -l app.kubernetes.io/name=openbao,openbao-active=true -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
            [[ -n "${ACTIVE_POD}" ]] && break
            sleep 2
          done

          if [[ -z "${ACTIVE_POD}" ]]; then
            echo "ERROR: no active OpenBao pod appeared" >&2
            exit 1
          fi

          echo "Verifying secret against active pod: ${ACTIVE_POD}"
          VALUE="$(/tmp/openbao-e2e/bin/bao-exec.sh "${ACTIVE_POD}" env BAO_TOKEN="${TOKEN}" bao kv get -field=value secret/e2e)"
          test "${VALUE}" = "snapshot-restore-e2e"

          echo "Restored secret verified successfully."
