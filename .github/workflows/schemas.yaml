---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Schemas
on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *
  push:
    branches:
      - main
    paths:
      - .github/workflows/schemas.yaml
env:
  UV_SYSTEM_PYTHON: "1"
permissions:
  contents: read
jobs:
  main:
    name: Schemas
    runs-on: ${{ github.event.repository.name }}-runner
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15.x
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - name: Install Python Dependencies
        run: uv pip install pyyaml
      - name: Generate schemas
        env:
          OUTPUT_DIR: ${{ runner.temp }}/crdSchemas
        run: |
          tools/crd-schema-generator/generate-schemas.sh
      - name: Publish Schemas
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}/crdSchemas
          command: pages deploy --project-name=kubernetes-schemas --branch main .
