---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kometa-quickstart
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kometa-quickstart
  values:
    controllers:
      quickstart:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: kometateam/quickstart
              tag: develop@sha256:36bc3db2e63fb1780f40c49a89139a94b2b61548d60bb0a5186c94604cd62e0e
            env:
              TZ: Europe/Sofia
            probes:
              startup:
                enabled: true
                spec:
                  periodSeconds: 30
                  failureThreshold: 10
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 7171
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi

      kometa:
        type: cronjob
        cronjob:
          schedule: "0 */6 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: kometateam/kometa
              tag: latest
            env:
              TZ: Europe/Sofia
            args:
              - --run
              - --config
              - /config/clever_archimedes_config.yml
              - --read-only-config

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      app:
        forceRename: quickstart
        controller: quickstart
        ports:
          http:
            port: &port 7171

    route:
      app:
        forceRename: quickstart
        hostnames:
          - quickstart.darkfellanetwork.com
        parentRefs:
          - name: internal
            namespace: envoy-gateway-system
            sectionName: https
        rules:
          - backendRefs:
              - name: quickstart
                port: *port

    persistence:
      config:
        existingClaim: kometa-quickstart
        advancedMounts:
          quickstart:
            app:
              - path: /config
          kometa:
            app:
              - path: /config
                subPath: kometa/config

      tmp:
        type: emptyDir
