---
# yaml-language-server: $schema=https://kubernetes-schemas-9iu.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gatus-secret
    template:
      data:
        DB_URL: "postgres://${{ .POSTGRES_USERNAME }}:${{ .POSTGRES_PASSWORD | urlquery }}@postgres-db-rw.database.svc.cluster.local:5432/gatus?sslmode=verify-full&sslrootcert=/etc/ssl/certs/postgres-ca.crt"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
  dataFrom:
    - extract:
        key: kv/gatus
    - extract:
        key: kv/pushover
